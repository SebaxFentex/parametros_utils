[project]
name = "parametros_utils"
version = "0.1.0"
description = "Parámetros de ejecución de tareas: periodo, si/no y opciones"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.5,<1.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "ruff==0.17.4",
    "ty==0.0.99",
]
